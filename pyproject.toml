[project]
name = "lang-chain-multi-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MunimChoudhary", email = "a.munim.farooq@gmail.com" }
] 
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.3",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "readability-lxml>=0.9",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "streamlit>=1.66.1",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
]

[project.scripts]
lang-chain-multi-agents = "lang_chain_multi_agents:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
[tool.uv]
package = false
